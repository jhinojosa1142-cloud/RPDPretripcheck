<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roma PD | Vehicle Inspection</title>
  <style>
    :root {
      --police-navy: #1b2631;
      --police-red: #c62828;
      --police-gold: #d4af37;
      --text-light: #ecf0f1;
    }

    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      background-color: #0a0e14; 
      color: var(--text-light); 
      margin: 0; padding: 20px;
    }

    .form-container { 
      max-width: 600px; margin: 0 auto; 
      background: var(--police-navy); 
      padding: 30px; border-radius: 8px; 
      border-left: 5px solid var(--police-red);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    header { text-align: center; margin-bottom: 30px; }
    h2 { color: var(--police-red); text-transform: uppercase; letter-spacing: 2px; margin: 10px 0; }

    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9rem; color: var(--police-gold); }
    
    /* Estilo para los nuevos Dropdowns */
    select, input, textarea { 
      width: 100%; padding: 12px; 
      background: #000; border: 1px solid #34495e; 
      color: #fff; border-radius: 4px; box-sizing: border-box; 
      font-size: 1rem;
    }

    select:focus { border-color: var(--police-red); outline: none; }

    .btn-submit { 
      width: 100%; background: var(--police-red); color: white; 
      border: none; padding: 15px; font-weight: bold; 
      cursor: pointer; border-radius: 4px; text-transform: uppercase;
      transition: 0.3s; margin-top: 10px;
    }
    .btn-submit:hover { background: #a51d1d; }

    .checkbox-group { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 4px; }
    .checkbox-group input { width: auto; }
  </style>
</head>
<body>

<div class="form-container">
  <header>
    <img src="logo.png" alt="Roma PD Logo" style="height: 80px;">
    <h2>Daily Vehicle Inspection</h2>
    <p style="font-size: 0.8rem; color: #bdc3c7;">Official Patrol Record - Roma, Texas</p>
  </header>

  <form id="inspectionForm">
    <div class="form-group">
      <label>Officer Name & Badge ID</label>
      <select id="officer" required>
        <option value="">-- Select Your Name --</option>
      </select>
    </div>

    <div class="form-group">
      <label>Patrol Unit #</label>
      <select id="unit" required>
        <option value="">-- Select Unit Number --</option>
      </select>
    </div>

    <div class="form-group">
      <label>Current Odometer (Miles)</label>
      <input type="number" id="odometer" placeholder="Enter mileage" required>
    </div>

    <div class="form-group checkbox-group">
      <input type="checkbox" id="damage_reported">
      <label style="margin:0;">Report New Damage or Mechanical Issues?</label>
    </div>

    <div class="form-group">
      <label>Notes / Comments</label>
      <textarea id="notes" rows="3" placeholder="Specify any issues found..."></textarea>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Submit Inspection</button>
  </form>
</div>

<script>
  // URL de tu primer Flow (Inspección)
  const FLOW_URL = "https://defaultc7482209c22b424696d4c965bb5a70.b0.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/a32eaff0a7bb4c1bbf730df99b5f3525/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=i3nXR2iPrDMLenk3RsZCZfMr4FVBZgH00dxCpDxAZ04";

  // DATOS OFICIALES PROPORCIONADOS
  const units = [
    { id: "100", info: "2012 Dodge Challenger" },
    { id: "101", info: "2017 Ford Explorer" },
    { id: "102", info: "2016 Ford Explorer" },
    { id: "104", info: "2024 Ford Explorer" },
    { id: "105", info: "2022 Dodge Charger" },
    { id: "106", info: "2021 Dodge Charger" },
    { id: "107", info: "2021 Dodge Charger" },
    { id: "108", info: "2024 Chevrolet Tahoe" },
    { id: "109", info: "2024 Chevrolet Tahoe" },
    { id: "110", info: "2018 Chevrolet Tahoe" },
    { id: "111", info: "2009 Ford F-250" },
    { id: "112", info: "2023 Dodge Durango" },
    { id: "113", info: "2018 Chevrolet Tahoe" },
    { id: "114", info: "2017 Ford Fusion" },
    { id: "116", info: "2016 Chevrolet Tahoe" },
    { id: "117", info: "2016 Chevrolet Tahoe" },
    { id: "118", info: "2019 Ford F-150" },
    { id: "119", info: "2019 Ford F-150" },
    { id: "120", info: "2021 Ford F-150" },
    { id: "121", info: "2021 Ford F-150" },
    { id: "122", info: "2024 Dodge Durango" },
    { id: "123", info: "2024 Chevrolet Tahoe" },
    { id: "124", info: "2024 Dodge Durango" }
  ];

  const officers = [
    { badge: "921", name: "Chief Iv Garza Jr." },
    { badge: "924", name: "Asst. Chief Francisco Garcia" },
    { badge: "928", name: "Sgt. Mario Madrigal" },
    { badge: "930", name: "Luis Alberto Morales" },
    { badge: "931", name: "Alexis Javier Escoto" },
    { badge: "932", name: "Sgt. Reynaldo Rodriguez Jr." },
    { badge: "933", name: "Saul Resendez" },
    { badge: "934", name: "Amber Lee Garza" },
    { badge: "935", name: "Nereo Garza Jr." },
    { badge: "937", name: "Roel Roberto Garcia Jr." },
    { badge: "938", name: "Lt. Juan Abel Alaniz" },
    { badge: "940", name: "Lino Cavazos Jr." },
    { badge: "942", name: "Nelson Martinez" },
    { badge: "943", name: "Jorge Daniel Oyervides Jr." },
    { badge: "945", name: "Jesse Guerra" },
    { badge: "946", name: "Monique Eliane Rosa" },
    { badge: "947", name: "Javier Herrera Jr." },
    { badge: "948", name: "Alex M. Garcia" },
    { badge: "949", name: "Daniel de la Cruz" },
    { badge: "950", name: "Josue Isai Resendez" },
    { badge: "952", name: "Cpl. Osiel Josue Canales" },
    { badge: "956", name: "Christian Emmanuel Diaz" },
    { badge: "957", name: "Cpl. Leonel Garza Jr." },
    { badge: "2203", name: "Det. Roberto Garza" },
    { badge: "2204", name: "Det. Ivan Garza" },
    { badge: "2206", name: "Francisco Xavier Treviño" }
  ];

  // Llenar listas al cargar
  window.onload = () => {
    const unitSelect = document.getElementById('unit');
    const officerSelect = document.getElementById('officer');

    units.forEach(u => {
      let opt = document.createElement('option');
      opt.value = u.id; // Lo que va a SharePoint
      opt.innerHTML = `UNIT ${u.id} | ${u.info}`;
      unitSelect.appendChild(opt);
    });

    officers.forEach(o => {
      let opt = document.createElement('option');
      opt.value = o.name; // Lo que va a SharePoint
      opt.innerHTML = `${o.badge} - ${o.name}`;
      officerSelect.appendChild(opt);
    });
  };

  document.getElementById('inspectionForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = "Processing...";

    const data = {
      officer: document.getElementById('officer').value,
      unit: document.getElementById('unit').value,
      odometer: document.getElementById('odometer').value,
      damage_reported: document.getElementById('damage_reported').checked,
      notes: document.getElementById('notes').value,
      date: new Date().toISOString()
    };

    try {
      const response = await fetch(FLOW_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      if (response.ok) {
        alert("✅ Inspection submitted successfully. Report generated.");
        e.target.reset();
      } else {
        throw new Error();
      }
    } catch (err) {
      alert("⚠️ Error submitting report. Please contact IT.");
    } finally {
      btn.disabled = false;
      btn.innerHTML = "Submit Inspection";
    }
  });
</script>

</body>
</html>
