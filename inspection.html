<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Inspection | Roma PD</title>
  <style>
    :root {
      --police-navy: #1b2631;
      --police-red: #c62828;
      --police-gold: #d4af37;
      --police-black: #0a0e14;
      --text-white: #ecf0f1;
    }

    body { 
      font-family: 'Segoe UI', Helvetica, Arial, sans-serif; 
      background-color: var(--police-black); 
      color: var(--text-white); 
      margin: 0; padding: 20px;
      display: flex; justify-content: center;
    }

    .form-card { 
      width: 100%; max-width: 700px; 
      background: var(--police-navy); 
      padding: 40px; border-radius: 12px; 
      border-top: 6px solid var(--police-red);
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }

    header { text-align: center; margin-bottom: 35px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
    header img { height: 90px; margin-bottom: 15px; }
    header h1 { margin: 0; font-size: 1.6rem; letter-spacing: 2px; }
    header p { margin: 5px 0 0; color: var(--police-red); font-weight: bold; }

    .section-title { 
      color: var(--police-gold); font-size: 0.9rem; font-weight: bold; 
      text-transform: uppercase; margin: 30px 0 15px; border-left: 3px solid var(--police-red); padding-left: 10px;
    }

    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.85rem; color: #bdc3c7; }
    
    select, input, textarea { 
      width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid #34495e; 
      color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 1rem;
    }

    /* Estilo de la Checklist */
    .checklist-grid { 
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 10px; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 8px;
    }

    .check-item { 
      display: flex; align-items: center; gap: 10px; font-size: 0.9rem; 
      padding: 8px; border-radius: 4px; transition: 0.2s;
    }
    .check-item:hover { background: rgba(255,255,255,0.05); }
    .check-item input { width: auto; transform: scale(1.2); cursor: pointer; }

    .btn-submit { 
      width: 100%; background: var(--police-red); color: white; border: none; 
      padding: 18px; font-size: 1.1rem; font-weight: bold; cursor: pointer; 
      border-radius: 6px; text-transform: uppercase; margin-top: 30px;
    }
    .btn-submit:hover { background: #e53935; transform: translateY(-2px); }

    footer { text-align: center; margin-top: 25px; font-size: 0.75rem; color: #5d6d7e; }
  </style>
</head>
<body>

<div class="form-card">
  <header>
    <img src="logo.png" alt="Roma PD">
    <h1>VEHICLE INSPECTION</h1>
    <p>ROMA POLICE DEPARTMENT</p>
  </header>

  <form id="inspectionForm">
    <div class="section-title">Personnel & Unit</div>
    <div class="form-group">
      <label>Officer Name & Badge</label>
      <select id="officer" required>
        <option value="">-- Select Officer --</option>
      </select>
    </div>

    <div class="form-group">
      <label>Patrol Unit / Vehicle</label>
      <select id="unit" required>
        <option value="">-- Select Unit --</option>
      </select>
    </div>

    <div class="form-group">
      <label>Current Odometer</label>
      <input type="number" id="odometer" placeholder="Enter mileage" required>
    </div>

    <div class="section-title">Equipment Checklist (Check if Functional)</div>
    <div class="checklist-grid">
      <label class="check-item"><input type="checkbox" class="check" value="emergency_lights"> Emergency Lights</label>
      <label class="check-item"><input type="checkbox" class="check" value="siren"> Siren & PA System</label>
      <label class="check-item"><input type="checkbox" class="check" value="radio"> Police Radio</label>
      <label class="check-item"><input type="checkbox" class="check" value="tires"> Tires Condition</label>
      <label class="check-item"><input type="checkbox" class="check" value="brakes"> Brakes System</label>
      <label class="check-item"><input type="checkbox" class="check" value="fluids"> Oil/Fluids Level</label>
      <label class="check-item"><input type="checkbox" class="check" value="interior"> Interior Cleanliness</label>
      <label class="check-item"><input type="checkbox" class="check" value="exterior"> Exterior Body</label>
      <label class="check-item"><input type="checkbox" class="check" value="fuel"> Fuel Level (Full)</label>
      <label class="check-item"><input type="checkbox" class="check" value="camera"> In-Car Camera</label>
    </div>

    <div class="section-title">Maintenance Report</div>
    <label class="check-item" style="background: rgba(198, 40, 40, 0.1); border: 1px solid var(--police-red); margin-bottom: 15px;">
      <input type="checkbox" id="damage_reported"> 
      <span style="color: var(--police-red); font-weight: bold;">REPORT NEW DAMAGE OR ISSUES</span>
    </label>

    <div class="form-group">
      <label>Detailed Notes</label>
      <textarea id="notes" rows="4" placeholder="Describe any defects or equipment needs..."></textarea>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Submit Official Report</button>
  </form>

  <footer>CITY OF ROMA, TEXAS | PUBLIC SAFETY DIVISION</footer>
</div>

<script>
  const FLOW_URL = "https://defaultc7482209c22b424696d4c965bb5a70.b0.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/a32eaff0a7bb4c1bbf730df99b5f3525/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=i3nXR2iPrDMLenk3RsZCZfMr4FVBZgH00dxCpDxAZ04";

  // LISTA DE UNIDADES (23)
  const unitList = [
    { id: "100", name: "2012 Dodge Challenger" },
    { id: "101", name: "2017 Ford Explorer" },
    { id: "102", name: "2016 Ford Explorer" },
    { id: "104", name: "2024 Ford Explorer" },
    { id: "105", name: "2022 Dodge Charger" },
    { id: "106", name: "2021 Dodge Charger" },
    { id: "107", name: "2021 Dodge Charger" },
    { id: "108", name: "2024 Chevrolet Tahoe" },
    { id: "109", name: "2024 Chevrolet Tahoe" },
    { id: "110", name: "2018 Chevrolet Tahoe" },
    { id: "111", name: "2009 Ford F-250" },
    { id: "112", name: "2023 Dodge Durango" },
    { id: "113", name: "2018 Chevrolet Tahoe" },
    { id: "114", name: "2017 Ford Fusion" },
    { id: "116", name: "2016 Chevrolet Tahoe" },
    { id: "117", name: "2016 Chevrolet Tahoe" },
    { id: "118", name: "2019 Ford F-150" },
    { id: "119", name: "2019 Ford F-150" },
    { id: "120", name: "2021 Ford F-150" },
    { id: "121", name: "2021 Ford F-150" },
    { id: "122", name: "2024 Dodge Durango" },
    { id: "123", name: "2024 Chevrolet Tahoe" },
    { id: "124", name: "2024 Dodge Durango" }
  ];

  // LISTA DE OFICIALES (26)
  const officerList = [
   { badge: "921", name: "Chief Iv Garza Jr." },
    { badge: "924", name: "Asst. Chief Francisco Garcia" },
    { badge: "928", name: "Sgt. Mario Madrigal" },
    { badge: "930", name: "Luis Alberto Morales" },
    { badge: "932", name: "Sgt. Reynaldo Rodriguez Jr." },
    { badge: "933", name: "Saul Resendez" },
    { badge: "934", name: "Amber Lee Garza" },
    { badge: "935", name: "Nereo Garza Jr." },
    { badge: "937", name: "Roel Roberto Garcia Jr." },
    { badge: "938", name: "Lt. Juan Abel Alaniz" },
    { badge: "942", name: "Nelson Martinez" },
    { badge: "943", name: "Jorge Daniel Oyervides Jr." },
    { badge: "948", name: "Alex M. Garcia" },
    { badge: "949", name: "Daniel de la Cruz" },
    { badge: "950", name: "Josue Isai Resendez" },
    { badge: "952", name: "Cpl. Osiel Josue Canales" },
    { badge: "956", name: "Christian Emmanuel Diaz" },
    { badge: "957", name: "Cpl. Leonel Garza Jr." },
    { badge: "2203", name: "Det. Roberto Garza" },
    { badge: "2204", name: "Det. Ivan Garza" },
    { badge: "2206", name: "Francisco Xavier Treviño" }
  ];

  window.onload = () => {
    const unitSelect = document.getElementById('unit');
    const officerSelect = document.getElementById('officer');
    unitList.forEach(u => {
      let opt = document.createElement('option'); opt.value = u.id;
      opt.innerHTML = `UNIT ${u.id} | ${u.name}`; unitSelect.appendChild(opt);
    });
    officerList.forEach(o => {
      let opt = document.createElement('option'); opt.value = o.name;
      opt.innerHTML = `BADGE #${o.badge} | ${o.name}`; officerSelect.appendChild(opt);
    });
  };

  document.getElementById('inspectionForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.innerHTML = "TRANSMITTING...";

    // Recopilar checklist
    const checklist = {};
    document.querySelectorAll('.check').forEach(box => {
      checklist[box.value] = box.checked;
    });

    const data = {
      officer: document.getElementById('officer').value,
      unit: document.getElementById('unit').value,
      odometer: document.getElementById('odometer').value,
      damage_reported: document.getElementById('damage_reported').checked,
      notes: document.getElementById('notes').value,
      checklist: checklist, // Se envía como objeto a Power Automate
      date: new Date().toISOString()
    };

    try {
      const response = await fetch(FLOW_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (response.ok) {
        alert("✅ REPORT SUBMITTED TO ROMA PD CLOUD.");
        e.target.reset();
      } else { throw new Error(); }
    } catch (err) {
      alert("⚠️ CONNECTION ERROR.");
    } finally {
      btn.disabled = false; btn.innerHTML = "Submit Official Report";
    }
  });
</script>

</body>
</html>
