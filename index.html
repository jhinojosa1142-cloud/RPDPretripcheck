<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Portal | Roma PD</title>
  <style>
    :root {
      --police-black: #0a0e14;
      --police-navy: #1b2631;
      --police-red: #c62828;
      --police-silver: #bdc3c7;
      --text-white: #ecf0f1;
      --accent-red: #ff1744;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--police-black);
      background-image: radial-gradient(circle at center, #1b2631 0%, #0a0e14 100%);
      color: var(--text-white);
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .portal-card {
      width: 100%;
      max-width: 500px;
      background: rgba(27, 38, 49, 0.8);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 12px;
      border: 1px solid rgba(189, 195, 199, 0.2);
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }

    .logo-container img {
      max-width: 180px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 10px rgba(198, 40, 40, 0.3));
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-white);
    }

    .dept-name {
      color: var(--police-red);
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 30px;
      display: block;
      font-size: 0.9rem;
    }

    .nav-options {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 20px;
      font-size: 1.1rem;
      font-weight: bold;
      text-decoration: none;
      color: white;
      border-radius: 8px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      border: 1px solid transparent;
    }

    /* Botón Formulario (Oficiales) */
    .btn-inspection {
      background: var(--police-red);
      box-shadow: 0 4px 15px rgba(198, 40, 40, 0.4);
    }
    .btn-inspection:hover {
      background: #e53935;
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(198, 40, 40, 0.6);
    }

    /* Botón Búsqueda (Supervisores) */
    .btn-search {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--police-silver);
      color: var(--police-silver);
    }
    .btn-search:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border-color: white;
      transform: translateY(-3px);
    }

    .footer-info {
      margin-top: 40px;
      font-size: 0.75rem;
      color: rgba(189, 195, 199, 0.5);
      text-transform: uppercase;
    }

    /* Animación de entrada */
    .portal-card {
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="portal-card">
  <div class="logo-container">
    <img src="logo.png" alt="Roma PD Shield">
  </div>
  
  <h1>Fleet Management</h1>
  <span class="dept-name">Roma Police Department</span>

  <div class="nav-options">
    <a href="inspection.html" class="nav-btn btn-inspection">
      <span>📋 Vehicle Inspection</span>
    </a>

    <a href="supervisor.html" class="nav-btn btn-search">
      <span>🔍 Search Records</span>
    </a>
  </div>

  <div class="footer-info">
    Official Use Only • System v3.0
  </div>
</div>

</body>
</html>
