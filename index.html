<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roma PD | Vehicle Inspection</title>
  <style>
    :root { --police-black: #0a0e14; --police-navy: #1b2631; --police-red: #c62828; --police-silver: #bdc3c7; --text-white: #ecf0f1; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--police-black); color: var(--text-white); margin: 0; padding: 10px; }
    .container { max-width: 900px; margin: 0 auto; background: var(--police-navy); padding: 25px; border: 1px solid var(--police-silver); border-radius: 8px; }
    header { text-align: center; border-bottom: 2px solid var(--police-red); margin-bottom: 20px; padding-bottom: 15px; }
    .logo-container img { max-width: 140px; display: block; margin: 0 auto 10px auto; }
    fieldset { border: 1px solid rgba(189,195,199,0.3); border-radius: 5px; margin-bottom: 20px; background: rgba(0,0,0,0.2); }
    legend { font-weight: bold; color: var(--police-red); padding: 0 10px; text-transform: uppercase; font-size: 0.85rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.8rem; color: var(--police-silver); }
    select, input, textarea { width: 100%; padding: 10px; background: #000; border: 1px solid #34495e; color: #fff; border-radius: 4px; box-sizing: border-box; }
    .check-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 5px 20px; }
    .check-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--police-red); cursor: pointer; }
    .btn-submit { background: var(--police-red); color: white; border: none; padding: 18px; width: 100%; font-size: 1.2rem; font-weight: bold; cursor: pointer; border-radius: 6px; text-transform: uppercase; margin-top: 10px; }
    .btn-submit:disabled { background: #555; }
  </style>
</head>
<body>
<main class="container">
  <form id="inspectionForm">
    <header>
      <div class="logo-container"><img src="logo.png" alt="Roma PD Logo"></div>
      <h1>Roma Police Department</h1>
      <div style="color:var(--police-red); font-weight:bold;">VEHICLE INSPECTION FORM</div>
    </header>

    <fieldset>
      <legend>Personnel & Unit Selection</legend>
      <div class="grid">
        <div>
          <label>OFFICER NAME</label>
          <select id="officer" required>
            <option value="" disabled selected>-- Select Officer --</option>
            <option value="921 - Chief Iv Garza Jr.">921 - Chief Iv Garza Jr.</option>
            <option value="924 - Asst. Chief Francisco Garcia">924 - Asst. Chief Francisco Garcia</option>
            <option value="928 - Sgt. Mario Madrigal">928 - Sgt. Mario Madrigal</option>
            <option value="930 - Luis Alberto Morales">930 - Luis Alberto Morales</option>
            <option value="931 - Alexis Javier Escoto">931 - Alexis Javier Escoto</option>
            <option value="932 - Sgt. Reynaldo Rodriguez Jr.">932 - Sgt. Reynaldo Rodriguez Jr.</option>
            <option value="933 - Saul Resendez">933 - Saul Resendez</option>
            <option value="934 - Amber Lee Garza">934 - Amber Lee Garza</option>
            <option value="935 - Nereo Garza Jr.">935 - Nereo Garza Jr.</option>
            <option value="937 - Roel Roberto Garcia Jr.">937 - Roel Roberto Garcia Jr.</option>
            <option value="938 - Lt. Juan Abel Alaniz">938 - Lt. Juan Abel Alaniz</option>
            <option value="940 - Lino Cavazos Jr.">940 - Lino Cavazos Jr.</option>
            <option value="942 - Nelson Martinez">942 - Nelson Martinez</option>
            <option value="943 - Jorge Daniel Oyervides Jr.">943 - Jorge Daniel Oyervides Jr.</option>
            <option value="945 - Jesse Guerra">945 - Jesse Guerra</option>
            <option value="946 - Monique Eliane Rosa">946 - Monique Eliane Rosa</option>
            <option value="947 - Javier Herrera Jr.">947 - Javier Herrera Jr.</option>
            <option value="948 - Alex M. Garcia">948 - Alex M. Garcia</option>
            <option value="949 - Daniel de la Cruz">949 - Daniel de la Cruz</option>
            <option value="950 - Josue Isai Resendez">950 - Josue Isai Resendez</option>
            <option value="952 - Cpl. Osiel Josue Canales">952 - Cpl. Osiel Josue Canales</option>
            <option value="956 - Christian Emmanuel Diaz">956 - Christian Emmanuel Diaz</option>
            <option value="957 - Cpl. Leonel Garza Jr.">957 - Cpl. Leonel Garza Jr.</option>
            <option value="2203 - Det. Roberto Garza">2203 - Det. Roberto Garza</option>
            <option value="2204 - Det. Ivan Garza">2204 - Det. Ivan Garza</option>
            <option value="2206 - Francisco Xavier Treviño">2206 - Francisco Xavier Treviño</option>
          </select>
        </div>
        <div>
          <label>VEHICLE UNIT #</label>
          <select id="unit" required>
            <option value="" disabled selected>-- Select Unit --</option>
            <option value="100 - 2012 Dodge Challenger">Unit 100 - 2012 Dodge Challenger</option>
            <option value="101 - 2017 Ford Explorer">Unit 101 - 2017 Ford Explorer</option>
            <option value="102 - 2016 Ford Explorer">Unit 102 - 2016 Ford Explorer</option>
            <option value="104 - 2024 Ford Explorer">Unit 104 - 2024 Ford Explorer</option>
            <option value="105 - 2022 Dodge Charger">Unit 105 - 2022 Dodge Charger</option>
            <option value="106 - 2021 Dodge Charger">Unit 106 - 2021 Dodge Charger</option>
            <option value="107 - 2021 Dodge Charger">Unit 107 - 2021 Dodge Charger</option>
            <option value="108 - 2024 Chevrolet Tahoe">Unit 108 - 2024 Chevrolet Tahoe</option>
            <option value="109 - 2024 Chevrolet Tahoe">Unit 109 - 2024 Chevrolet Tahoe</option>
            <option value="110 - 2018 Chevrolet Tahoe">Unit 110 - 2018 Chevrolet Tahoe</option>
            <option value="111 - 2009 Ford F-250">Unit 111 - 2009 Ford F-250</option>
            <option value="112 - 2023 Dodge Durango">Unit 112 - 2023 Dodge Durango</option>
            <option value="113 - 2018 Chevrolet Tahoe">Unit 113 - 2018 Chevrolet Tahoe</option>
            <option value="114 - 2017 Ford Fusion">Unit 114 - 2017 Ford Fusion</option>
            <option value="116 - 2016 Chevrolet Tahoe">Unit 116 - 2016 Chevrolet Tahoe</option>
            <option value="117 - 2016 Chevrolet Tahoe">Unit 117 - 2016 Chevrolet Tahoe</option>
            <option value="118 - 2019 Ford F-150">Unit 118 - 2019 Ford F-150</option>
            <option value="119 - 2019 Ford F-150">Unit 119 - 2019 Ford F-150</option>
            <option value="120 - 2021 Ford F-150">Unit 120 - 2021 Ford F-150</option>
            <option value="121 - 2021 Ford F-150">Unit 121 - 2021 Ford F-150</option>
            <option value="122 - 2024 Dodge Durango">Unit 122 - 2024 Dodge Durango</option>
            <option value="123 - 2024 Chevrolet Tahoe">Unit 123 - 2024 Chevrolet Tahoe</option>
            <option value="124 - 2024 Dodge Durango">Unit 124 - 2024 Dodge Durango</option>
          </select>
        </div>
      </div>
      <div class="grid">
        <div><label>ODOMETER</label><input type="number" id="odometer" required></div>
        <div><label>DATE</label><input type="date" id="date" required></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Checklist</legend>
      <div class="check-grid">
        <div class="check-item"><label>Engine Oil / Fluids OK</label><input type="checkbox" id="oil"></div>
        <div class="check-item"><label>Lights & Signals OK</label><input type="checkbox" id="lights"></div>
        <div class="check-item"><label>Tires & Pressure OK</label><input type="checkbox" id="tires"></div>
        <div class="check-item"><label>Emergency Siren/Lights OK</label><input type="checkbox" id="siren"></div>
        <div class="check-item" style="color:var(--accent-red); font-weight:bold;"><label>REPORT NEW DAMAGE</label><input type="checkbox" id="damage_reported"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Notes & Remarks</legend>
      <textarea id="notes" rows="4" placeholder="Enter details..."></textarea>
    </fieldset>

    <button type="submit" id="submitBtn" class="btn-submit">Submit Inspection</button>
  </form>
</main>

<script>
  document.getElementById('date').valueAsDate = new Date();
  const FLOW_URL = "https://defaultc7482209c22b424696d4c965bb5a70.b0.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/a32eaff0a7bb4c1bbf730df99b5f3525/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=i3nXR2iPrDMLenk3RsZCZfMr4FVBZgH00dxCpDxAZ04";

  document.getElementById('inspectionForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "Sending...";

    const payload = {
      officer: document.getElementById('officer').value,
      unit: document.getElementById('unit').value,
      odometer: parseInt(document.getElementById('odometer').value),
      date: document.getElementById('date').value,
      notes: document.getElementById('notes').value,
      damage_reported: document.getElementById('damage_reported').checked
    };

    try {
      const resp = await fetch(FLOW_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if(resp.ok) { alert('✅ Sent Successfully!'); e.target.reset(); document.getElementById('date').valueAsDate = new Date(); }
      else { alert('❌ Flow Error. Check Schema.'); }
    } catch(err) { alert('❌ Connection Error.'); }
    finally { btn.disabled = false; btn.innerText = "Submit Inspection"; }
  });
</script>
</body>
</html>
