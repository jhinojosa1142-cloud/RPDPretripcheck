<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Programador Señor - Roma PD System">
  <title>Vehicle Inspection Form | Roma PD</title>
  <style>
    :root {
      --police-black: #0a0e14;
      --police-navy: #1b2631;
      --police-red: #c62828;
      --police-silver: #bdc3c7;
      --text-white: #ecf0f1;
      --accent-red: #ff1744;
    }

    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      background-color: var(--police-black); 
      color: var(--text-white);
      margin: 0; padding: 15px;
    }

    .container { 
      max-width: 900px; margin: 0 auto; 
      background: var(--police-navy); 
      padding: 30px; 
      border: 1px solid var(--police-silver);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Encabezado */
    header { text-align: center; border-bottom: 2px solid var(--police-red); margin-bottom: 20px; padding-bottom: 20px; }
    
    /* IMAGEN LOCAL: Asegúrate que el archivo se llame logo.png y esté junto al HTML */
    .logo-container img { 
      max-width: 180px; 
      height: auto; 
      margin-bottom: 10px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    h1 { margin: 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 1px; }
    .form-title { color: var(--police-red); font-weight: bold; font-size: 1.1rem; }

    .instructions { 
      font-size: 0.8rem; border: 1px dashed var(--police-silver); 
      padding: 10px; margin: 20px 0; text-align: center; color: var(--police-silver);
    }

    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    
    fieldset { 
      border: 1px solid rgba(189, 195, 199, 0.3); 
      border-radius: 5px; margin-bottom: 25px; background: rgba(0,0,0,0.2);
    }
    legend { font-weight: bold; color: var(--police-red); padding: 0 10px; text-transform: uppercase; font-size: 0.9rem; }

    .check-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 5px 20px; }
    
    .check-item { 
      display: flex; align-items: center; justify-content: space-between; 
      padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: background 0.2s;
    }
    .check-item:hover { background: rgba(255,255,255,0.03); }
    .check-item label { font-size: 0.85rem; cursor: pointer; flex: 1; }
    
    input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--police-red); cursor: pointer; }

    input[type="text"], input[type="number"], input[type="date"], textarea {
      width: 100%; padding: 12px; background: #000; border: 1px solid #34495e;
      color: #fff; border-radius: 4px; box-sizing: border-box; font-size: 1rem;
    }

    /* Diagrama de Daños */
    .damage-flex { display: flex; flex-wrap: wrap; gap: 30px; align-items: center; justify-content: center; }
    .svg-box { background: #fff; padding: 20px; border-radius: 8px; border: 2px solid var(--police-silver); }
    .car-part { fill: #d1d1d1; stroke: #333; stroke-width: 2; cursor: pointer; transition: 0.3s; }
    .car-part.active { fill: var(--accent-red) !important; stroke: #000; }

    .btn-submit { 
      background: var(--police-red); color: white; border: none; padding: 20px; 
      width: 100%; font-size: 1.3rem; font-weight: bold; cursor: pointer; 
      border-radius: 6px; text-transform: uppercase; margin-top: 15px;
      box-shadow: 0 4px 0 #801919;
    }
    .btn-submit:hover { background: var(--accent-red); transform: translateY(-2px); }
    .btn-submit:active { transform: translateY(2px); box-shadow: none; }

    @media (max-width: 600px) { .meta-grid, .check-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<main class="container">
  <form id="inspectionForm">
    <header>
      <div class="logo-container">
        <img src="logo.png" alt="Roma Police Dept Logo">
      </div>
      <h1>Roma Police Department</h1>
      <div class="form-title">VEHICLE INSPECTION FORM</div>
    </header>

    <div class="instructions">
      <strong>OFFICIAL NOTICE:</strong> DRIVER MUST INSPECT THE ASSIGNED VEHICLE BEFORE THE VEHICLE IS MOVED.
    </div>

    <fieldset>
      <legend>Unit & Odometer</legend>
      <div class="meta-grid">
        <div>
          <label for="tag">Vehicle Tag No.</label>
          <input type="text" id="tag" name="tag" placeholder="Unit ID" required>
        </div>
        <div>
          <label for="odometer">Current Odometer</label>
          <input type="number" id="odometer" name="odometer" placeholder="Miles" required>
          <small id="odo-warning" style="color:var(--accent-red); display:none;">Error: Mileage lower than last record.</small>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>WITH ENGINE OFF</legend>
      <div class="check-grid">
        <div class="check-item"><label for="oil">Engine Oil Within Limits</label><input type="checkbox" id="oil"></div>
        <div class="check-item"><label for="belts">Fan Belts Condition</label><input type="checkbox" id="belts"></div>
        <div class="check-item"><label for="coolant">Coolant Level Acceptable</label><input type="checkbox" id="coolant"></div>
        <div class="check-item"><label for="washer">Washer Fluid Level</label><input type="checkbox" id="washer"></div>
        <div class="check-item"><label for="ext_clean">Exterior Clean</label><input type="checkbox" id="ext_clean"></div>
        <div class="check-item"><label for="int_clean">Interior Clean</label><input type="checkbox" id="int_clean"></div>
        <div class="check-item"><label for="wipers">Windshield Wipers</label><input type="checkbox" id="wipers"></div>
        <div class="check-item"><label for="seatbelts">Seat Belt Function</label><input type="checkbox" id="seatbelts"></div>
        <div class="check-item"><label for="inflation">Tire Inflation (PSI)</label><input type="checkbox" id="inflation"></div>
        <div class="check-item"><label for="tread">Tire Tread/Sidewalls</label><input type="checkbox" id="tread"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>ENGINE RUNNING</legend>
      <div class="check-grid">
        <div class="check-item"><label for="lights">Headlights (HI/LO)</label><input type="checkbox" id="lights"></div>
        <div class="check-item"><label for="signals">Turn Signals (L/R)</label><input type="checkbox" id="signals"></div>
        <div class="check-item"><label for="brake_lights">Brake Lights (inc. 3rd)</label><input type="checkbox" id="brake_lights"></div>
        <div class="check-item"><label for="reverse">Reverse Lights</label><input type="checkbox" id="reverse"></div>
        <div class="check-item"><label for="leaks">No Fluid Leaks</label><input type="checkbox" id="leaks"></div>
        <div class="check-item"><label for="horn">Horn Sounds</label><input type="checkbox" id="horn"></div>
        <div class="check-item"><label for="mirrors">Mirrors Clean/Func.</label><input type="checkbox" id="mirrors"></div>
        <div class="check-item"><label for="siren">Emergency Lights/Siren</label><input type="checkbox" id="siren"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Visual Damage Report</legend>
      <div class="damage-flex">
        <div class="svg-box">
          <svg viewBox="0 0 200 350" width="180">
            <rect x="55" y="40" width="90" height="260" rx="20" class="car-part" data-id="dmg_body" /> <path d="M 65 110 Q 100 95 135 110 L 130 140 Q 100 130 70 140 Z" class="car-part" data-id="dmg_glass" /> <rect x="35" y="70" width="18" height="40" rx="4" class="car-part" data-id="dmg_tires" /> <rect x="147" y="70" width="18" height="40" rx="4" class="car-part" data-id="dmg_tires" /> <rect x="35" y="230" width="18" height="40" rx="4" class="car-part" data-id="dmg_tires" /> <rect x="147" y="230" width="18" height="40" rx="4" class="car-part" data-id="dmg_tires" /> </svg>
        </div>
        <div style="flex:1; min-width:250px;">
          <div class="check-item"><label for="dmg_body">New Body Damage Found</label><input type="checkbox" id="dmg_body"></div>
          <div class="check-item"><label for="dmg_glass">Windshield/Window Crack</label><input type="checkbox" id="dmg_glass"></div>
          <div class="check-item"><label for="dmg_tires">Tire Damage Noted</label><input type="checkbox" id="dmg_tires"></div>
          <label style="margin-top:15px; display:block;">REPAIR NOTES:</label>
          <textarea id="notes" rows="4" placeholder="Describe any missing/broken items..."></textarea>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Authentication</legend>
      <div class="meta-grid">
        <div>
          <label>OFFICER (Print Name)</label>
          <input type="text" id="off_name" required>
          <label style="margin-top:10px;">Date</label>
          <input type="date" id="off_date" required>
        </div>
        <div>
          <label>SERGEANT (Print Name)</label>
          <input type="text" id="ser_name">
          <label style="margin-top:10px;">Date</label>
          <input type="date" id="ser_date">
        </div>
      </div>
    </fieldset>

    <button type="submit" class="btn-submit">Submit Official Report</button>
  </form>
</main>

<script>
  // Simulación de validación de odómetro (Evita errores de dedo)
  const lastOdometer = 45200; // Esto vendría de tu base de datos
  const odoInput = document.getElementById('odometer');
  const odoWarning = document.getElementById('odo-warning');

  odoInput.addEventListener('input', () => {
    if(odoInput.value > 0 && odoInput.value < lastOdometer) {
      odoWarning.style.display = 'block';
      odoInput.style.borderColor = 'var(--accent-red)';
    } else {
      odoWarning.style.display = 'none';
      odoInput.style.borderColor = '#34495e';
    }
  });

  // Vincular Diagrama SVG con Checkboxes
  document.querySelectorAll('.car-part').forEach(part => {
    part.addEventListener('click', function() {
      const id = this.getAttribute('data-id');
      const chk = document.getElementById(id);
      if(chk) {
        chk.checked = !chk.checked;
        this.classList.toggle('active', chk.checked);
      }
    });
  });

  // Manejo del Envío
  document.getElementById('inspectionForm').addEventListener('submit', (e) => {
    if(odoInput.value < lastOdometer) {
      e.preventDefault();
      alert('Error: Odometer reading cannot be less than previous record.');
      return;
    }
    e.preventDefault();
    alert('Inspection Report logged into Roma PD Secure Database.');
  });
</script>

</body>
</html>
