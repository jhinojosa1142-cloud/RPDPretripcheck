<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Inspection | Roma PD Fleet</title>
  <style>
    :root {
      --police-black: #0a0e14;
      --police-navy: #1b2631;
      --police-red: #c62828;
      --police-silver: #bdc3c7;
      --text-white: #ecf0f1;
      --accent-red: #ff1744;
    }

    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      background-color: var(--police-black); 
      color: var(--text-white);
      margin: 0; padding: 15px;
    }

    .container { 
      max-width: 900px; margin: 0 auto; 
      background: var(--police-navy); 
      padding: 30px; 
      border: 1px solid var(--police-silver);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    header { text-align: center; border-bottom: 2px solid var(--police-red); margin-bottom: 20px; padding-bottom: 20px; }
    .logo-container img { max-width: 160px; height: auto; display: block; margin: 0 auto 10px auto; }
    h1 { margin: 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 1px; }
    .form-title { color: var(--police-red); font-weight: bold; font-size: 1.1rem; }

    fieldset { 
      border: 1px solid rgba(189, 195, 199, 0.3); 
      border-radius: 5px; margin-bottom: 25px; background: rgba(0,0,0,0.2);
    }
    legend { font-weight: bold; color: var(--police-red); padding: 0 10px; text-transform: uppercase; font-size: 0.9rem; }

    .grid-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9rem; color: var(--police-silver); }

    select, input, textarea {
      width: 100%; padding: 12px; background: #000; border: 1px solid #34495e;
      color: #fff; border-radius: 4px; box-sizing: border-box; font-size: 1rem;
    }

    .check-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 5px 20px; }
    .check-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--police-red); cursor: pointer; }

    .damage-flex { display: flex; flex-wrap: wrap; gap: 30px; align-items: center; justify-content: center; }
    .svg-box { background: #fff; padding: 15px; border-radius: 8px; }
    .car-part { fill: #d1d1d1; stroke: #333; stroke-width: 2; cursor: pointer; transition: 0.3s; }
    .car-part.active { fill: var(--accent-red) !important; }

    .btn-submit { 
      background: var(--police-red); color: white; border: none; padding: 20px; 
      width: 100%; font-size: 1.3rem; font-weight: bold; cursor: pointer; border-radius: 6px; 
      text-transform: uppercase; box-shadow: 0 4px 0 #801919;
    }
    .btn-submit:hover { background: var(--accent-red); transform: translateY(-2px); }

    @media (max-width: 600px) { .grid-fields, .check-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<main class="container">
  <form id="inspectionForm">
    <header>
      <div class="logo-container">
        <img src="logo.png" alt="Roma PD Shield">
      </div>
      <h1>Roma Police Department</h1>
      <div class="form-title">VEHICLE INSPECTION FORM</div>
    </header>

    <fieldset>
      <legend>Personnel & Unit Selection</legend>
      <div class="grid-fields">
        <div>
          <label for="off_name">OFFICER NAME</label>
          <select id="off_name" name="off_name" required>
            <option value="" disabled selected>-- Select Officer --</option>
            <option value="921">921 - Chief Iv Garza Jr.</option>
            <option value="924">924 - Asst. Chief Francisco Garcia</option>
            <option value="928">928 - Sgt. Mario Madrigal</option>
            <option value="930">930 - Luis Alberto Morales</option>
            <option value="931">931 - Alexis Javier Escoto</option>
            <option value="932">932 - Sgt. Reynaldo Rodriguez Jr.</option>
            <option value="933">933 - Saul Resendez</option>
            <option value="934">934 - Amber Lee Garza</option>
            <option value="935">935 - Nereo Garza Jr.</option>
            <option value="937">937 - Roel Roberto Garcia Jr.</option>
            <option value="938">938 - Lt. Juan Abel Alaniz</option>
            <option value="940">940 - Lino Cavazos Jr.</option>
            <option value="942">942 - Nelson Martinez</option>
            <option value="943">943 - Jorge Daniel Oyervides Jr.</option>
            <option value="945">945 - Jesse Guerra</option>
            <option value="946">946 - Monique Eliane Rosa</option>
            <option value="947">947 - Javier Herrera Jr.</option>
            <option value="948">948 - Alex M. Garcia</option>
            <option value="949">949 - Daniel de la Cruz</option>
            <option value="950">950 - Josue Isai Resendez</option>
            <option value="952">952 - Cpl. Osiel Josue Canales</option>
            <option value="956">956 - Christian Emmanuel Diaz</option>
            <option value="957">957 - Cpl. Leonel Garza Jr.</option>
            <option value="2203">2203 - Det. Roberto Garza</option>
            <option value="2204">2204 - Det. Ivan Garza</option>
            <option value="2206">2206 - Francisco Xavier Treviño</option>
          </select>
        </div>
        <div>
          <label for="unit_no">VEHICLE UNIT #</label>
          <select id="unit_no" name="unit_no" required>
            <option value="" disabled selected>-- Select Unit --</option>
            <option value="100">Unit 100 - 2012 Dodge Challenger</option>
            <option value="101">Unit 101 - 2017 Ford Explorer</option>
            <option value="102">Unit 102 - 2016 Ford Explorer</option>
            <option value="104">Unit 104 - 2024 Ford Explorer</option>
            <option value="105">Unit 105 - 2022 Dodge Charger</option>
            <option value="106">Unit 106 - 2021 Dodge Charger</option>
            <option value="107">Unit 107 - 2021 Dodge Charger</option>
            <option value="108">Unit 108 - 2024 Chevrolet Tahoe</option>
            <option value="109">Unit 109 - 2024 Chevrolet Tahoe</option>
            <option value="110">Unit 110 - 2018 Chevrolet Tahoe</option>
            <option value="111">Unit 111 - 2009 Ford F-250</option>
            <option value="112">Unit 112 - 2023 Dodge Durango</option>
            <option value="113">Unit 113 - 2018 Chevrolet Tahoe</option>
            <option value="114">Unit 114 - 2017 Ford Fusion</option>
            <option value="116">Unit 116 - 2016 Chevrolet Tahoe</option>
            <option value="117">Unit 117 - 2016 Chevrolet Tahoe</option>
            <option value="118">Unit 118 - 2019 Ford F-150</option>
            <option value="119">Unit 119 - 2019 Ford F-150</option>
            <option value="120">Unit 120 - 2021 Ford F-150</option>
            <option value="121">Unit 121 - 2021 Ford F-150</option>
            <option value="122">Unit 122 - 2024 Dodge Durango</option>
            <option value="123">Unit 123 - 2024 Chevrolet Tahoe</option>
            <option value="124">Unit 124 - 2024 Dodge Durango</option>
          </select>
        </div>
      </div>
      <div class="grid-fields">
        <div>
          <label for="odometer">Odometer Reading</label>
          <input type="number" id="odometer" name="odometer" required placeholder="Enter Miles">
        </div>
        <div>
          <label for="off_date">Date of Inspection</label>
          <input type="date" id="off_date" name="off_date" required>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Inspection Checklist</legend>
      <div class="check-grid">
        <div class="check-item"><label for="oil">Oil / Fluids Level</label><input type="checkbox" id="oil"></div>
        <div class="check-item"><label for="coolant">Coolant Level</label><input type="checkbox" id="coolant"></div>
        <div class="check-item"><label for="lights">All Exterior Lights</label><input type="checkbox" id="lights"></div>
        <div class="check-item"><label for="siren">Siren & Emergency Lights</label><input type="checkbox" id="siren"></div>
        <div class="check-item"><label for="tires">Tires Condition/PSI</label><input type="checkbox" id="tires"></div>
        <div class="check-item"><label for="clean">Interior/Exterior Clean</label><input type="checkbox" id="clean"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Damage Map</legend>
      <div class="damage-flex">
        <div class="svg-box">
          <svg viewBox="0 0 200 350" width="180">
            <rect x="55" y="40" width="90" height="260" rx="20" class="car-part" data-id="dmg_body" />
            <path d="M 65 110 Q 100 95 135 110 L 130 140 Q 100 130 70 140 Z" class="car-part" data-id="dmg_glass" />
            <rect x="35" y="70" width="18" height="40" rx="4" class="car-part" data-id="dmg_tires" />
            <rect x="147" y="70" width="18" height="40" rx="4" class="car-part" data-id="dmg_tires" />
          </svg>
        </div>
        <div style="flex:1;">
          <div class="check-item"><label for="dmg_body">New Body Damage</label><input type="checkbox" id="dmg_body"></div>
          <div class="check-item"><label for="dmg_glass">Glass/Windshield Damage</label><input type="checkbox" id="dmg_glass"></div>
          <textarea id="notes" rows="4" placeholder="Additional details or repairs needed..."></textarea>
        </div>
      </div>
    </fieldset>

    <button type="submit" class="btn-submit">Submit Official Report</button>
  </form>
</main>

<script>
  // Inicializar fecha
  document.getElementById('off_date').valueAsDate = new Date();

  // Interactividad del Mapa
  document.querySelectorAll('.car-part').forEach(part => {
    part.addEventListener('click', function() {
      const id = this.getAttribute('data-id');
      const chk = document.getElementById(id);
      if(chk) { chk.checked = !chk.checked; this.classList.toggle('active', chk.checked); }
    });
  });

  // Manejo de envío
  document.getElementById('inspectionForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const unit = document.getElementById('unit_no').value;
    const officer = document.getElementById('off_name').value;
    alert(`Report submitted for Unit ${unit} by Officer ${officer}.`);
  });
</script>

</body>
</html>
