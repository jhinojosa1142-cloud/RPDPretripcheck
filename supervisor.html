<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supervisor Panel | Roma PD</title>
  <style>
    :root {
      --police-black: #0a0e14;
      --police-navy: #1b2631;
      --police-red: #c62828;
      --police-silver: #bdc3c7;
      --text-white: #ecf0f1;
      --accent-blue: #2980b9;
      --success-green: #2ecc71;
    }

    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      background-color: var(--police-black); 
      color: var(--text-white); 
      margin: 0; padding: 20px;
      line-height: 1.6;
    }

    .dashboard-container { 
      max-width: 1200px; margin: 0 auto; 
      background: var(--police-navy); 
      padding: 30px; border-radius: 8px; 
      border-top: 5px solid var(--police-red);
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
    }

    header { 
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(189,195,199,0.2);
      margin-bottom: 25px; padding-bottom: 20px;
    }

    .logo-container img { height: 70px; }

    .search-panel { 
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 20px; background: rgba(0,0,0,0.4); padding: 25px; border-radius: 6px;
      margin-bottom: 30px; border: 1px solid rgba(189,195,199,0.1);
    }

    label { display: block; font-size: 0.75rem; font-weight: bold; color: var(--police-silver); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    
    input { 
      width: 100%; padding: 12px; background: #000; border: 1px solid #34495e; 
      color: #fff; border-radius: 4px; box-sizing: border-box; font-size: 1rem;
    }
    input:focus { border-color: var(--police-red); outline: none; }

    .btn-search { 
      background: var(--accent-blue); color: white; border: none; padding: 12px; 
      font-weight: bold; cursor: pointer; border-radius: 4px; align-self: end;
      text-transform: uppercase; transition: all 0.3s ease; height: 48px;
    }
    .btn-search:hover { background: #3498db; transform: translateY(-2px); }

    /* Tabla de Resultados */
    .results-wrapper { overflow-x: auto; border-radius: 4px; background: rgba(0,0,0,0.2); }
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    th { background: #000; color: var(--police-red); text-align: left; padding: 15px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid var(--police-red); }
    td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.95rem; }
    tr:hover { background: rgba(255,255,255,0.05); }

    /* Etiquetas de Estado */
    .badge { padding: 5px 12px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; display: inline-block; }
    .badge-danger { background: #7b1f1f; color: #ffbcbc; border: 1px solid #ff1744; }
    .badge-success { background: #1b4d2e; color: #bcffcc; border: 1px solid var(--success-green); }

    .btn-action { 
      background: transparent; border: 1px solid var(--police-silver); color: var(--police-silver);
      padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold;
      transition: 0.2s; text-decoration: none; display: inline-block;
    }
    .btn-action:hover { background: var(--text-white); color: #000; border-color: white; }

    .no-results { text-align: center; padding: 60px; color: var(--police-silver); font-style: italic; }
    .back-nav { color: var(--police-silver); text-decoration: none; font-size: 0.85rem; margin-bottom: 20px; display: inline-block; transition: 0.2s; }
    .back-nav:hover { color: var(--police-red); }
  </style>
</head>
<body>

<div class="dashboard-container">
  <a href="index.html" class="back-nav">← Back to Portal</a>
  
  <header>
    <div>
      <h1 style="margin:0; font-size: 1.8rem;">INSPECTION DATABASE</h1>
      <span style="color: var(--police-red); font-weight: bold;">ROMA POLICE DEPARTMENT | SUPERVISOR ACCESS</span>
    </div>
    <div class="logo-container">
      <img src="logo.png" alt="Roma PD Logo">
    </div>
  </header>

  <section class="search-panel">
    <div>
      <label>Search by Unit #</label>
      <input type="text" id="unitFilter" placeholder="e.g. 108">
    </div>
    <div>
      <label>Search by Officer</label>
      <input type="text" id="officerFilter" placeholder="Officer name...">
    </div>
    <button class="btn-search" onclick="runSearch()">🔍 Search Records</button>
  </section>

  <div class="results-wrapper">
    <table id="mainTable">
      <thead>
        <tr>
          <th>Inspection Date</th>
          <th>Unit</th>
          <th>Officer Name</th>
          <th>Odometer</th>
          <th>Condition</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="resultsBody">
        <tr>
          <td colspan="6" class="no-results">Please enter a Unit # or Officer Name to retrieve records.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // URL del Flow de Búsqueda
  const SEARCH_FLOW_URL = "https://defaultc7482209c22b424696d4c965bb5a70.b0.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/5a0139d014a24e3b9ee11c0e60add979/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=-3FRtOlUWZ-o3sJ9JDG73PtzqgHOB4pcNPi2Ii-Qc_8";

  async function runSearch() {
    const tableBody = document.getElementById('resultsBody');
    const unit = document.getElementById('unitFilter').value;
    const officer = document.getElementById('officerFilter').value;

    // Estado: Buscando
    tableBody.innerHTML = '<tr><td colspan="6" class="no-results">⏳ Querying SharePoint Database...</td></tr>';

    try {
      const response = await fetch(SEARCH_FLOW_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ unit: unit, officer: officer })
      });

      if (!response.ok) throw new Error('Error en el servidor');

      const data = await response.json();

      if (!data || data.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="6" class="no-results">❌ No matching records found.</td></tr>';
        return;
      }

      tableBody.innerHTML = ''; // Limpiar tabla

      data.forEach(item => {
        const row = document.createElement('tr');
        
        // Formatear la fecha para que sea legible
        const dateObj = new Date(item.date || item.InspectionDate || item.Created);
        const dateStr = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

        // Lógica de Daños
        const isDamaged = item.damage_reported === true || item.damage_reported === "true" || item.DamageReported === true;
        const badge = isDamaged 
          ? '<span class="badge badge-danger">Damage Found</span>' 
          : '<span class="badge badge-success">Clean</span>';

        row.innerHTML = `
          <td>${dateStr}</td>
          <td style="font-weight:bold; color:white;">${item.unit || item.UnitNumber || item.Title}</td>
          <td>${item.officer || item.OfficerName}</td>
          <td>${item.odometer || '0'} mi</td>
          <td>${badge}</td>
          <td>
            <button class="btn-action" onclick="printReport('${item.ID}')">🖨️ View/Print</button>
          </td>
        `;
        tableBody.appendChild(row);
      });

    } catch (error) {
      console.error(error);
      tableBody.innerHTML = '<tr><td colspan="6" class="no-results" style="color:var(--police-red);">⚠️ Failed to connect to SharePoint. Verify Flow URL.</td></tr>';
    }
  }

  function printReport(id) {
    // Esto abre el registro en SharePoint para imprimirlo
    // Reemplaza con tus datos reales de dominio/sitio/lista
    const spUrl = `https://TU_DOMINIO.sharepoint.com/sites/TU_SITIO/Lists/TU_LISTA/DispForm.aspx?ID=${id}`;
    window.open(spUrl, '_blank');
  }
</script>

</body>
</html>
